<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Christmas Surprise</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe Script',cursive;}

body{
    height:100vh;
    background:linear-gradient(#ffffff,#e6f3ff);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* ❄ Snowfall */
.snow{
    position:fixed;
    top:-10px;
    color:#cce7ff;
    animation:fall linear infinite;
}
@keyframes fall{to{transform:translateY(110vh);}}

/* Screens */
.screen{display:none;text-align:center;}
#screen1{display:block;}

/* Typing text */
.text1{
    font-size:32px;
    color:#333;
    margin-bottom:30px;
    white-space:nowrap;
    overflow:hidden;
    border-right:3px solid #333;
    width:0;
    animation:typing 3s steps(20,end) forwards,blink .7s infinite;
}
@keyframes typing{to{width:20ch;}}
@keyframes blink{50%{border-color:transparent;}}

/* 🎁 ORIGINAL GIFT */
.gift-wrap{position:relative;cursor:pointer;margin-top:60px;}

.tap-bubble{
    position:absolute;
    top:-55px;left:50%;
    transform:translateX(-50%);
    background:#fff;color:#e60023;
    padding:6px 14px;
    border-radius:20px;
    font-weight:bold;
    font-family:Arial;
    animation:bounce 1s infinite;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}
@keyframes bounce{50%{transform:translate(-50%,-8px);}}

.gift{
    width:120px;height:110px;
    border:6px solid #e60023;
    border-radius:12px;
    background:#ffe6ea;
    position:relative;
    animation:shake 1.5s infinite;
    margin:auto;
}
@keyframes shake{
    25%{transform:rotate(3deg);}
    75%{transform:rotate(-3deg);}
}
.ribbon-v{
    position:absolute;width:16px;height:100%;
    background:#e60023;
    left:50%;transform:translateX(-50%);
}
.ribbon-h{
    position:absolute;height:16px;width:100%;
    background:#e60023;
    top:50%;transform:translateY(-50%);
}
.bow-l,.bow-r{
    position:absolute;
    width:40px;height:30px;
    border:6px solid #e60023;
    border-radius:50%;
    top:-30px;background:#fff;
}
.bow-l{left:18px;}
.bow-r{right:18px;}

/* CARD (2nd screen) */
.card{
    width:360px;height:560px;
    background:#fffdf8;
    border-radius:22px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
    padding-top:30px;
    animation:fade 1s;
}
@keyframes fade{
    from{opacity:0;transform:scale(.6);}
    to{opacity:1;transform:scale(1);}
}
.card .text{
    font-size:26px;color:#333;
    padding:0 30px;margin-top:10px;
}
.btn{
    margin-top:20px;
    padding:14px 60px;
    background:linear-gradient(135deg,#19b6ff,#2c6cff);
    color:#fff;border-radius:30px;
    display:inline-block;
    cursor:pointer;font-family:Arial;
}

/* FINAL PAGE */
.final-card{
    width:430px;
    background:#fffef9;
    padding:35px 25px 45px;
    border-radius:22px;
    box-shadow:0 12px 30px rgba(0,0,0,.15);
}
.title{font-size:34px;color:#333;}
.subtitle{font-size:18px;color:#777;margin-bottom:30px;}

.notes{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;justify-items:center;
}
.note{width:95px;height:95px;perspective:800px;}
.inner{width:100%;height:100%;transition:.8s;transform-style:preserve-3d;}
.note.open .inner{transform:rotateY(180deg);}
.front,.back{
    position:absolute;width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    border-radius:6px;
    backface-visibility:hidden;
    background:#ffe1ea;
    box-shadow:0 6px 12px rgba(0,0,0,.15);
}
.front{font-size:32px;color:#ff4d6d;animation:pulse 1.2s infinite;}
@keyframes pulse{50%{transform:scale(1.2);}}
.back{transform:rotateY(180deg);font-size:18px;color:#444;}
.note:nth-child(4){grid-column:1/3;}
.note:nth-child(5){grid-column:2/4;}
</style>
</head>

<body>

<!-- SCREEN 1 -->
<div class="screen" id="screen1">
    <div class="text1">This is For You Kanishka</div>
    <div class="gift-wrap" onclick="show2()">
        <div class="tap-bubble">Tap me!</div>
        <div class="gift">
            <div class="bow-l"></div>
            <div class="bow-r"></div>
            <div class="ribbon-v"></div>
            <div class="ribbon-h"></div>
        </div>
    </div>
</div>

<!-- SCREEN 2 (SNOWMAN BACK) -->
<div class="screen" id="screen2">
    <div class="card">

        <!-- ⛄ SAME SNOWMAN -->
        <!-- ⛄ ORIGINAL SNOWMAN (SAME AS FIRST CODE) -->
<svg width="160" height="180" viewBox="0 0 160 180" style="margin:auto;display:block;">
    <text x="10" y="60" font-size="18">❄️</text>
    <text x="120" y="70" font-size="16">❄️</text>
    <text x="130" y="110" font-size="14">❄️</text>

    <!-- Hat -->
    <rect x="55" y="5" width="50" height="30" rx="4" fill="#111"/>
    <rect x="45" y="35" width="70" height="6" fill="#111"/>
    <rect x="55" y="22" width="50" height="6" fill="#d40000"/>

    <!-- Head -->
    <circle cx="80" cy="60" r="28" fill="#fff"/>
    <circle cx="70" cy="55" r="3.5" fill="#111"/>
    <circle cx="90" cy="55" r="3.5" fill="#111"/>
    <polygon points="80,60 86,65 80,66" fill="orange"/>

    <!-- Scarf -->
    <rect x="55" y="85" width="50" height="12" rx="6" fill="#d40000"/>
    <rect x="75" y="95" width="10" height="20" rx="4" fill="#d40000"/>

    <!-- Body -->
    <circle cx="80" cy="120" r="38" fill="#fff"/>
    <circle cx="80" cy="110" r="3.5" fill="#111"/>
    <circle cx="80" cy="125" r="3.5" fill="#111"/>

    <!-- Hands -->
    <line x1="42" y1="110" x2="20" y2="95" stroke="#9b6a3d" stroke-width="4"/>
    <line x1="118" y1="110" x2="140" y2="95" stroke="#9b6a3d" stroke-width="4"/>

    <!-- Gloves -->
    <circle cx="18" cy="94" r="8" fill="#1e90ff"/>
    <circle cx="142" cy="94" r="8" fill="#1e90ff"/>
</svg>


        <div class="text">
            This Christmas,<br>something special for you
        </div>
        <div class="btn" onclick="show3()">Open it</div>
    </div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="screen3">
    <div class="final-card">
        <div class="title">Just for you</div>
        <div class="subtitle">I don’t need a gift, because…</div>

        <div class="notes">
            <div class="note"><div class="inner"><div class="front">❤</div><div class="back">You</div></div></div>
            <div class="note"><div class="inner"><div class="front">❤</div><div class="back">are</div></div></div>
            <div class="note"><div class="inner"><div class="front">❤</div><div class="back">my</div></div></div>
            <div class="note"><div class="inner"><div class="front">❤</div><div class="back">cutest</div></div></div>
            <div class="note"><div class="inner"><div class="front">❤</div><div class="back">gift 🎁</div></div></div>
        </div>
    </div>
</div>

<script>
/* Snow */
for(let i=0;i<40;i++){
    let s=document.createElement("div");
    s.className="snow";
    s.innerHTML="❄";
    s.style.left=Math.random()*100+"vw";
    s.style.fontSize=10+Math.random()*20+"px";
    s.style.animationDuration=3+Math.random()*5+"s";
    document.body.appendChild(s);
}

function show2(){screen1.style.display="none";screen2.style.display="block";}
function show3(){screen2.style.display="none";screen3.style.display="block";}

document.querySelectorAll(".note").forEach(n=>{
    n.onclick=()=>n.classList.add("open");
});
</script>

</body>
</html>
